{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p>Дата: {{ post.created_at|date:"d.m.Y H:i" }}</p>
<p>Просмотров: {{ post.views_count }}</p>
{% if post.preview %}
    <img src="{{ post.preview.url }}" alt="{{ post.title }}" width="300">
{% endif %}
<p>{{ post.content }}</p>
<a href="{% url 'blog:list' %}">Назад к списку</a>
{% endblock %}
