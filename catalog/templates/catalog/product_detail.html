{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="card-title">{{ product.name }}</h1>
        <p class="card-text">{{ product.description }}</p>
        <p class="card-text">Цена: {{ product.price }}</p>

        <div class="mt-3">
            <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">
                Назад к списку
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-primary">
                Редактировать
            </a>
            <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">
                Удалить
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
