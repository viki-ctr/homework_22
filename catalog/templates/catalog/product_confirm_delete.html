{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="card-title">Подтверждение удаления</h2>
        <p>Вы уверены, что хотите удалить продукт "{{ object.name }}"?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
